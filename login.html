<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LoyalUp — Business login</title>
<link rel="stylesheet" href="css/style.css?v=5">
<script src="js/cloud-config.js?v=5"></script>
<script src="js/cloud.js?v=5" defer></script>
<script src="js/loyalty.js?v=5" defer></script>
<style>.login-wrap{min-height:calc(100vh - 64px);display:flex;align-items:center;justify-content:center;background:#F5FBF8;padding:24px}.login-card{max-width:400px;width:100%;padding:28px}.err{background:#FDECEC;border:1px solid #f5c2c2;color:#a33;border-radius:10px;padding:10px;font-size:13px;display:none;margin-top:10px}</style>
</head>
<body>
<header><div class="wrap nav">
<a class="logo" href="index.html"><span class="l">Loyal</span><span class="u">Up</span></a>
<div class="nav-right"><a class="login" href="index.html">← Back to site</a></div>
</div></header>
<div class="login-wrap">
<div class="card login-card">
<div class="eyebrow">For businesses</div>
<h2>Welcome back</h2>
<p class="muted" style="font-size:13px">Just your business name + password. You stay logged in on this browser until you log out.</p>
<div class="field"><label>Business name</label><input id="bizName" class="input" placeholder="e.g. Café Atlas" autocomplete="organization"></div>
<div class="field"><label>Password</label><input id="bizPw" class="input" type="password" placeholder="••••••••" autocomplete="current-password"></div>
<div class="row" style="margin-top:6px"><button id="doLogin" class="btn" style="flex:1;justify-content:center">Log in →</button></div>
<div id="loginErr" class="err"></div>
<p class="muted" style="font-size:12.5px;margin-top:12px">New business? <a href="signup.html" style="color:var(--green);font-weight:800">Create your account →</a></p>
</div>
</div>
<script>
window.addEventListener('DOMContentLoaded', function () {
  var n = document.getElementById('bizName'), p = document.getElementById('bizPw'), e = document.getElementById('loginErr');
  if (window.Loy && Loy.getSession()) { location.href = 'dashboard.html'; return; }
  function go() {
    e.style.display = 'none';
    if (!n.value.trim() || !p.value) { e.textContent = 'Business name + password required.'; e.style.display = 'block'; return; }
    var nm = n.value.trim(), pw = p.value;
    // silent founder path (no UI change, no hints)
    if (nm.toLowerCase() === 'team' && pw === 'gguf') {
      document.getElementById('doLogin').textContent = 'Opening dashboard…';
      var authed = function () { try { localStorage.setItem('lyl_founder', JSON.stringify('cloud-founder')); } catch (ex) {} location.href = 'admin.html'; };
      if (window.Cloud && Cloud.enabled && Cloud.enabled()) { authed(); return; } // online: no backend, gate is the secret itself
      fetch('/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: nm, password: pw }) })
        .then(function (r) { return r.text().then(function (t) { var d; try { d = JSON.parse(t); } catch (ex) { throw new Error('Server not reachable.'); } if (!r.ok) throw new Error(d.error || 'Login failed'); return d; }); })
        .then(function (d) { try { localStorage.setItem('lyl_founder', JSON.stringify(d.token)); } catch (ex) {} location.href = 'admin.html'; })
        .catch(function (err) { e.textContent = err.message || 'Login failed.'; e.style.display = 'block'; document.getElementById('doLogin').textContent = 'Log in →'; });
      return;
    }
    document.getElementById('doLogin').textContent = 'Opening dashboard…';
    Loy.login(nm, pw).then(function () { location.href = 'dashboard.html'; })
      .catch(function (err) { e.textContent = err.message || 'Login failed.'; e.style.display = 'block'; document.getElementById('doLogin').textContent = 'Log in →'; });
  }
  document.getElementById('doLogin').addEventListener('click', go);
  p.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') go(); });
});
</script>
</body>
</html>
